services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caltrack_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - caltrack_network
    depends_on:
      - postgres
      - redis
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis

  nginx:
    image: nginx:alpine
    container_name: caltrack_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - caltrack_network
    depends_on:
      - app

  postgres:
    image: postgres:17-alpine
    container_name: caltrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-caltrack}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - caltrack_network

  redis:
    image: redis:7-alpine
    container_name: caltrack_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - caltrack_network

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caltrack_queue_worker
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --tries=3 --timeout=120
    volumes:
      - ./:/var/www
    networks:
      - caltrack_network
    depends_on:
      - app
      - postgres
      - redis

networks:
  caltrack_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
